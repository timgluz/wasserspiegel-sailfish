[package]
name = "wasserspiegel-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for the Wasserspiegel Sailfish OS app"
license = "MIT"
build = "build.rs"

[lib]
name = "wasserspiegel_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[build-dependencies]
cxx-build = "1"
cxx = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
