# https://taskfile.dev

version: "3"

dotenv:
  - ".envrc"

vars:
  RUST_TARGET: aarch64-unknown-linux-gnu
  RUST_DIR: "{{.ROOT_DIR}}/rust"
  # default phone target for `task deploy` (override: task deploy DEVICE=nemo@10.0.0.2)
  DEVICE: defaultuser@192.168.2.15

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  deps:
    desc: Fetch Rust dependencies
    silent: true
    cmds:
      - echo "Fetching dependencies..."
      - cargo fetch --manifest-path "{{.RUST_DIR}}/Cargo.toml"

  build:
    desc: "Build the Rust core + Sailfish RPM via sfdk (commit changes first)"
    silent: true
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
    deps:
      - engine:rust
    cmds:
      - echo "Building the app (--prepare so source changes are picked up)..."
      - sfdk build --prepare

  sign:setup:
    desc: "Configure sfdk for RPM signing (SIGNING_USER + PASSPHRASE_FILE)"
    silent: true
    vars:
      PASSPHRASE_FILE: '{{default "$HOME/passphrase.txt" .PASSPHRASE_FILE}}'
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
      - sh: test -n "{{.SIGNING_USER}}"
        msg: "SIGNING_USER is required, e.g. task sign:setup SIGNING_USER='Timo Sulg'"
    cmds:
      - echo "Configuring signing key '{{.SIGNING_USER}}'..."
      - sfdk config --global --push package.signing-user "{{.SIGNING_USER}}"
      - sfdk config --global --push package.signing-passphrase-file "{{.PASSPHRASE_FILE}}"

  sign:
    desc: "Build and sign the RPM (commit first; run sign:setup once)"
    silent: true
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
    deps:
      - engine:rust
    cmds:
      - echo "Building and signing..."
      - sfdk build --prepare --sign

  verify:
    desc: "Verify the RPM signature (rpm -K)"
    silent: true
    preconditions:
      - sh: command -v rpm
        msg: "rpm not found - install the rpm tools."
      - sh: test -n "$(find {{.ROOT_DIR}}/RPMS -name '*.rpm' -print -quit 2>/dev/null)"
        msg: "No RPM found - run 'task sign' first."
    cmds:
      - rpm -K {{.ROOT_DIR}}/RPMS/harbour-wasserspiegel-*.rpm

  release:
    desc: "Build a signed + signature-verified release RPM (commit first; run sign:setup once)"
    silent: true
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
      - sh: command -v rpm
        msg: "rpm not found - install the rpm tools."
    cmds:
      - task: sign
      - task: verify
      - echo "Release RPM:"
      - ls -la {{.ROOT_DIR}}/RPMS/harbour-wasserspiegel-*.rpm
      - sha256sum {{.ROOT_DIR}}/RPMS/harbour-wasserspiegel-*.rpm

  check:
    desc: "Run Harbour + rpmlint quality checks on the RPM (sfdk check)"
    silent: true
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
    cmds:
      - echo "Running quality checks (Harbour + rpmlint)..."
      - sfdk check

  engine:setup:
    desc: "One-time build-engine setup (Rust toolchain + credential forwarding)"
    silent: true
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
    cmds:
      - echo "Setting up Rust in the build engine..."
      - bash "{{.RUST_DIR}}/engine-setup.sh"

  engine:rust:
    desc: Cross-compile the Rust core for aarch64 in the SDK build engine
    silent: true
    preconditions:
      - sh: command -v sfdk
        msg: "sfdk not found - install the Sailfish SDK and add it to PATH."
      - sh: test -x "{{.RUST_DIR}}/engine-setup.sh"
        msg: "run 'task engine:setup' first"
    cmds:
      - echo "Cross-compiling wasserspiegel-core ({{.RUST_TARGET}})..."
      - bash "{{.RUST_DIR}}/engine-build.sh"

  test:
    desc: Run Rust core unit + fixture tests
    silent: true
    cmds:
      - task: deps
      - echo "Running tests..."
      - cargo test --manifest-path "{{.RUST_DIR}}/Cargo.toml"

  "test:live":
    desc: Run live API smoke tests (uses .envrc credentials)
    silent: true
    preconditions:
      - sh: test -n "$WASSERSPIEGEL_API" -a -n "$WASSERSPIEGEL_TOKEN"
        msg: "WASSERSPIEGEL_API / WASSERSPIEGEL_TOKEN are required (see .envrc)."
    cmds:
      - echo "Running live API tests against {{.WASSERSPIEGEL_API}}..."
      - cargo test --manifest-path "{{.RUST_DIR}}/Cargo.toml" --test live_smoke -- --ignored --nocapture

  smoke:
    desc: Host C++ bridge smoke test (live API, g++ required)
    silent: true
    preconditions:
      - sh: command -v g++
        msg: "g++ is required to compile the bridge smoke test."
      - sh: test -n "$WASSERSPIEGEL_API" -a -n "$WASSERSPIEGEL_TOKEN"
        msg: "WASSERSPIEGEL_API / WASSERSPIEGEL_TOKEN are required (see .envrc)."
    cmds:
      - echo "Building host debug staticlib..."
      - cargo build --manifest-path "{{.RUST_DIR}}/Cargo.toml"
      - echo "Compiling and running the bridge smoke test..."
      - g++ -std=c++17 -I "{{.RUST_DIR}}/include" "{{.RUST_DIR}}/smoke/bridge_smoke.cpp" "{{.RUST_DIR}}/target/debug/libwasserspiegel_core.a" -ldl -pthread -o "{{.RUST_DIR}}/target/debug/bridge_smoke"
      - "{{.RUST_DIR}}/target/debug/bridge_smoke"

  "test:all":
    desc: Run unit tests, live API tests and the C++ bridge smoke test
    silent: true
    cmds:
      - task: test
      - task: "test:live"
      - task: smoke

  lint:
    desc: Check formatting and run clippy on the Rust core
    silent: true
    cmds:
      - task: deps
      - echo "Running linter..."
      - cargo fmt --manifest-path "{{.RUST_DIR}}/Cargo.toml" --check
      - cargo clippy --manifest-path "{{.RUST_DIR}}/Cargo.toml" --all-targets -- -D warnings

  fmt:
    desc: Auto-format the Rust core
    silent: true
    cmds:
      - cargo fmt --manifest-path "{{.RUST_DIR}}/Cargo.toml"

  clean:
    desc: Remove build artifacts (cargo + RPM + shadow build output)
    silent: true
    cmds:
      - echo "Cleaning..."
      - cargo clean --manifest-path "{{.RUST_DIR}}/Cargo.toml"
      - rm -rf "{{.ROOT_DIR}}/RPMS" "{{.ROOT_DIR}}/.sfdk"

  deploy:
    desc: "Install the built RPM on a phone (default: defaultuser@192.168.2.15)"
    silent: true
    preconditions:
      - sh: test -n "{{.DEVICE}}"
        msg: "DEVICE is required, e.g. task deploy DEVICE=nemo@192.168.2.15"
      - sh: test -n "$(find {{.ROOT_DIR}}/RPMS -name '*.rpm' -print -quit 2>/dev/null)"
        msg: "No RPM found - run 'task build' first."
      - sh: test -n "$JOLLA_SSH_PASSWORD"
        msg: "JOLLA_SSH_PASSWORD not set - source .envrc"
    cmds:
      - echo "Deploying to {{.DEVICE}}..."
      - scp {{.ROOT_DIR}}/RPMS/harbour-wasserspiegel-*.rpm "{{.DEVICE}}:/tmp/harbour-wasserspiegel.rpm"
      - ssh "{{.DEVICE}}" "echo '$JOLLA_SSH_PASSWORD' | devel-su pkcon install-local -y /tmp/harbour-wasserspiegel.rpm"

  screenshots:
    desc: "Pull screenshots from the phone and upscale to 1080 width (store minimum)"
    silent: true
    preconditions:
      - sh: test -n "{{.DEVICE}}"
        msg: "DEVICE is required, e.g. task screenshots DEVICE=nemo@192.168.2.15"
      - sh: command -v magick
        msg: "ImageMagick (magick) is required to resize the screenshots."
    cmds:
      - echo "Pulling screenshots from {{.DEVICE}}..."
      - mkdir -p {{.ROOT_DIR}}/screenshots
      - scp "{{.DEVICE}}:~/Pictures/Screenshots/*.png" {{.ROOT_DIR}}/screenshots/
      - echo "Upscaling to 1080 width..."
      - 'for f in {{.ROOT_DIR}}/screenshots/*.png; do magick "$f" -filter Lanczos -resize 1080x "$f"; done'
